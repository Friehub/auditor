[workspace]
members = ["frensense-bundler","frensense-engine", "frensense-frc", "frensense-lang", "frensense-providers", "frensense-runtime"]
resolver = "2"

[package]
name = "frensense"
version = "0.6.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense: High-performance semantic diagnostic engine for Rust, TypeScript, and Solidity."
repository = "https://github.com/Friehub/frensense"
homepage = "https://friehub.github.io/frensense/"
documentation = "https://friehub.github.io/frensense/"
license = "MIT"
categories = ["development-tools::static-analysis", "security"]
keywords = ["static-analysis", "linter", "security", "code-quality"]
publish = true
rust-version = "1.95"

[lib]
name = "frensense"

[[bin]]
name = "frensense"
path = "src/bin/frensense.rs"

[[bin]]
name = "frensense-mcp"
path = "src/bin/frensense-mcp.rs"

[[bin]]
name = "corpus-quality"
path = "src/bin/corpus-quality.rs"

[dependencies]
frensense-engine = { path = "frensense-engine", version = "0.6.0", features = ["full-analysis"] }
tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
thiserror = "1.0"
tracing = { version = "0.1", features = ["attributes"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
regex = "1"
walkdir = "2"
diff = "0.1"
glob = "0.3"
petgraph = "0.6"
pathdiff = "0.2"
rustc-hash = "1.1"
blake3 = "1.5"
toml = "0.8"
frensense-bundler = { version = "0.6.0", path = "frensense-bundler" }
frensense-providers = { version = "0.6.0", path = "frensense-providers" }

[features]
default = ["rust", "typescript", "fingerprinting", "temporal"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["frensense-engine/python", "dep:tree-sitter-python"]
html = ["frensense-engine/html", "dep:tree-sitter-html"]
fingerprinting = ["frensense-engine/serialize"]
temporal = []
rust-hir = ["frensense-providers/rust-hir"]

[dev-dependencies]
tempfile = "3"
criterion = "0.5"

[[bench]]
name = "engine_perf"
path = "tests/benchmarks/engine_perf.rs"
harness = false
