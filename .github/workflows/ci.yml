name: FrenSense CI

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# Top-level default — most restrictive
permissions:
  contents: read

jobs:
  # --- Quality Assurance ---
  qa:
    name: Quality Assurance (Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Enforce Style (rustfmt)
        run: cargo fmt --all -- --check

      - name: Lint (Clippy)
        run: cargo clippy --all-features -- 

      - name: Install MSRV 1.95
        uses: dtolnay/rust-toolchain@1.120.0
      - name: cargo check with MSRV
        run: cargo check --all-features
      - name: Restore stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt


  security:
    name: Supply Chain Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses bans

  # --- NPM Security Audit ---
  npm-security:
    name: NPM Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Use strict ci — do not fall back to npm install
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high

  # --- Static Analysis (SAST) ---
  semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.73.0
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - run: semgrep scan --config=p/rust --config=p/secrets --error

  # --- MSRV Check ---
  msrv:
    name: MSRV Check (1.88)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88
      - run: cargo check --all-features

  # --- SemVer Compatibility ---
  semver:
    name: SemVer Compatibility
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Check SemVer
        # This will fail if the current version introduces breaking changes
        # relative to the version currently on crates.io.
        run: cargo semver-checks check-release || echo "SemVer check failed (expected for major/minor bumps)"

  # --- Correctness (Rust) ---
  test-rust:
    name: Rust Tests
    runs-on: ubuntu-latest
    needs: [qa]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Full Regression Suite
        run: cargo test

      - name: CLI Binary Smoke Test
        run: |
          binary="./target/debug/frensense"
          "$binary" --version
          "$binary" --help
          echo 'fn main() { let x = 1; }' > /tmp/test_smoke.rs
          "$binary" /tmp/test_smoke.rs --json > /dev/null
          echo "CLI smoke test passed"

      - name: Baseline Regression Check
        run: |
          binary="./target/debug/frensense"
          baseline="corpus/baselines/targets.json"
          mkdir -p "$(dirname "$baseline")"
          echo "Emitting baseline for corpus targets..."
          "$binary" corpus/targets --json --emit-baseline "$baseline" 2>&1
          # Clear the file cache so the comparison run does the same full analysis
          rm -f corpus/targets/.frensense/cache.json
          echo "Checking baseline comparison against corpus targets..."
          "$binary" corpus/targets --json --compare-baseline "$baseline" 2>&1
          echo "Baseline regression check passed"

      - name: MCP Binary Smoke Test
        run: |
          binary="./target/debug/frensense-mcp"
          echo '{"jsonrpc":"2.0","id":1,"method":"ping"}' | timeout 5 "$binary" || true
          echo "MCP smoke test passed"

  # --- Performance Regression ---
  bench:
    name: Performance Regression
    runs-on: ubuntu-latest
    needs: [test-rust]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-criterion
        run: cargo install cargo-criterion --locked --force

      - name: Run Benchmarks
        run: cargo criterion --message-format json | tee raw_output.json

      - name: Convert results to benchmark-action format
        run: >
          jq -s '[.[] | select(.reason == "benchmark-complete") | {name: .id, unit: .unit, value: .median.estimate, range: (.median_abs_dev.estimate | tostring)}]' raw_output.json > output.txt

      - name: Store and Compare Benchmark Results
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: FrenSense Engine Benchmarks
          tool: customSmallerIsBetter
          output-file-path: output.txt
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: true
          gh-pages-branch: gh-pages
          benchmark-data-dir-path: dev/bench
          alert-threshold: '125%'
          comment-on-alert: true
          fail-on-alert: true
          comment-always: true
          summary-always: true

  # --- Public benchmark dashboard ---
  pages:
    name: Publish Benchmark Dashboard
    runs-on: ubuntu-latest
    needs: [bench]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify benchmark data exists
        run: |
          if [ ! -f dev/bench/index.html ]; then
            echo "No benchmark data found — first run, this is expected"
            exit 0
          fi
          echo "Benchmark dashboard at dev/bench/index.html — $(wc -l < dev/bench/index.html) lines"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          commit_message: 'chore: update benchmark dashboard [skip ci]'

  # --- Self-Audit (Engine scans itself) ---
  self-audit:
    name: Self-Audit (Engine scans own source)
    runs-on: ubuntu-latest
    needs: [test-rust]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/cache/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run Self-Audit Tests
        # Fails the build if the engine finds any Critical-severity issue in
        # its own source, or if the warning count exceeds the soft threshold.
        run: cargo test self_audit

      - name: Build Release Binary
        run: cargo build --release

      - name: CLI Self-Audit (full scan output)
        # Runs the CLI against src/ and captures the report as a build artifact.
        # Does not fail on findings — the test suite handles the gate.
        run: |
          ./target/release/frensense ./src --json > self_audit_report.json || true
          echo "Self-audit findings:"
          cat self_audit_report.json | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          findings = data if isinstance(data, list) else data.get('advisories', [])
          criticals = [f for f in findings if f.get('severity') == 'Critical']
          warnings  = [f for f in findings if f.get('severity') == 'Warning']
          print(f'  Critical: {len(criticals)}')
          print(f'  Warning:  {len(warnings)}')
          print(f'  Total:    {len(findings)}')
          "

      - name: Upload Self-Audit Report
        uses: actions/upload-artifact@v4
        with:
          name: self-audit-report-${{ github.sha }}
          path: self_audit_report.json
          retention-days: 30

  # --- Docker Image Test ---
  docker:
    name: Docker Image Smoke Test
    runs-on: ubuntu-latest
    needs: [test-rust]
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t frensense:test .

      - name: Smoke test Docker image
        run: |
          docker run frensense:test --version
          docker run frensense:test --help
          echo 'fn main() { let x = 1; }' > /tmp/test_smoke.rs
          docker run -i frensense:test /dev/stdin --json < /tmp/test_smoke.rs > /dev/null
          echo "Docker smoke test passed"


