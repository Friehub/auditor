[package]
name = "frensense-engine"
version = "0.6.0"
authors = ["Friehub Developers"]
edition = "2024"
description = "Frensense engine core — structural code analysis primitives (fingerprints, profiles, semantic graph, taint, temporal events)"
license = "MIT"
repository = "https://github.com/Friehub/frensense"
rust-version = "1.95"

[lib]
name = "frensense_engine"

[dependencies]
frensense-lang = { path = "../frensense-lang", version = "0.6.0" }
frensense-frc = { path = "../frensense-frc", version = "0.6.0" }

tracing = "0.1"
tree-sitter = "0.23"
tree-sitter-rust = { version = "0.23", optional = true }
tree-sitter-typescript = { version = "0.23", optional = true }
tree-sitter-javascript = { version = "0.23", optional = true }
tree-sitter-python = { version = "0.23", optional = true }
tree-sitter-html = { version = "0.23", optional = true }
rustc-hash = "1.1"
rayon = "1"
thiserror = "2"
petgraph = "0.6"
regex = "1"
serde = { version = "1.0", features = ["derive"], optional = true }
serde_json = { version = "1.0", optional = true }
bincode = { version = "1", optional = true }
blake3 = { version = "1.5", optional = true }
toml = "0.8"
tree-sitter-go = "0.23.0"

[features]
default = ["rust", "typescript", "serialize", "full-analysis"]
rust = ["dep:tree-sitter-rust"]
typescript = ["dep:tree-sitter-typescript", "dep:tree-sitter-javascript"]
python = ["dep:tree-sitter-python"]
html = ["dep:tree-sitter-html"]
serialize = ["dep:serde", "dep:serde_json", "dep:bincode", "dep:blake3"]
full-analysis = []

[dev-dependencies]
tempfile = "3"

[[bin]]
name = 'dump_filter'
path = 'dump_filter.rs'


[[bin]]
name = 'dump_filter2'
path = 'dump_filter2.rs'


[[bin]]
name = 'dump_filter3'
path = 'dump_filter3.rs'

